[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W: style, F: unused names and undefined variables, I: import order,
# B: likely bugs, UP: outdated syntax, DJ: Django mistakes, S: security.
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S"]  # tests use fake keys and asserts
